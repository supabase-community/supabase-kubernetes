name: Tests

on:
  pull_request:

jobs:
  test:
    name: Run on Ubuntu
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Running Tests
        run: |
          go mod tidy
          make test

      - name: Test password synchronization against PostgreSQL
        run: go test -tags=integration ./internal/assets -run TestReadOnlyPasswordSync -count=1 -v
