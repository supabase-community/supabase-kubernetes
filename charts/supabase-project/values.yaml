## String to partially override chart.fullname template (will maintain the release name)
##
# nameOverride: ""

## String to fully override chart.fullname template
##
# fullnameOverride: ""

## Project top-level configuration
##
project:
  jwtExpSec: 3600
  publicUrl: ""

## Initial database migration configuration.
## The migration contains the Supabase bootstrap SQL bundled with this chart.
migrations:
  enable: true
  pod: {}

## SingleDatabase configuration
##
singleDatabase:
  pod: {}
  service: {}
  storage:
    accessModes: [ReadWriteOnce]
    resources:
      requests:
        storage: 20Gi
    # storageClassName: ""

## Rest component configuration
##
rest:
  enable: true
  replicas: 1
  pod: {}
  service: {}
  config: []

## Meta component configuration
##
meta:
  enable: true
  replicas: 1
  pod: {}
  service: {}
  config: []

## Realtime component configuration
##
realtime:
  enable: true
  replicas: 1
  pod: {}
  service: {}
  config: []

## Auth component configuration
##
auth:
  enable: true
  replicas: 1
  pod: {}
  service: {}
  config: []

## EdgeRuntime component configuration
##
edgeRuntime:
  enable: true
  replicas: 1
  pod: {}
  service: {}
  config: []

## Envoy component configuration
##
