## String to partially override chart.fullname template (will maintain the release name)
##
# nameOverride: ""

## String to fully override chart.fullname template
##
# fullnameOverride: ""

## Project top-level configuration
##
project:
  jwtExpSec: 3600
  publicUrl: ""
  migrations:
    enable: true
    pod: {}

## Expose Studio and APIs on the same host through Envoy.
## Set project.publicUrl to the corresponding public URL.
##
ingress:
  enable: false
  className: ""
  annotations: {}
  host: ""
  tls: []

## SingleDatabase configuration
##
singleDatabase:
  pod: {}
  service: {}
  storage:
    accessModes: [ReadWriteOnce]
    resources:
      requests:
        storage: 20Gi
    # storageClassName: ""

## Rest component configuration
##
rest:
  enable: true
  replicas: 1
  pod: {}
  service: {}
  config: []

## Meta component configuration
##
meta:
  enable: true
  replicas: 1
  pod: {}
  service: {}
  config: []

## Realtime component configuration
##
realtime:
  enable: true
  replicas: 1
  pod: {}
  service: {}
  config: []

## Auth component configuration
##
auth:
  enable: true
  replicas: 1
  pod: {}
  service: {}
  config: []

## EdgeRuntime component configuration
##
edgeRuntime:
  enable: true
  replicas: 1
  pod: {}
  service: {}
  config: []

## Envoy component configuration
##
envoy:
  enable: true
  replicas: 1
  pod: {}
  service: {}
  config: []

## Storage component configuration
##
storage:
  enable: true
  replicas: 1
  pod: {}
  service: {}
  config: []
  storage:
    accessModes: [ReadWriteOnce]
    resources:
      requests:
        storage: 5Gi
    # storageClassName: ""

## Studio component configuration
##
studio:
  enable: true
  replicas: 1
  pod: {}
  service: {}
  config: []
  storage:
    accessModes: [ReadWriteOnce]
    resources:
      requests:
        storage: 1Gi
    # storageClassName: ""
