## EdgeRuntime component configuration
##
edgeRuntime:
  enable: true
  replicas: 1
  pod: {}
  service: {}
  config:
    - name: VERIFY_JWT
      value: "false"

## Envoy component configuration
##
envoy:
  enable: true
  replicas: 1
  pod: {}
  service: {}
  config: []

## Storage component configuration
##
storage:
  enable: true
  replicas: 1
  pod: {}
  service: {}
  config:
    - name: FILE_SIZE_LIMIT
      value: "52428800"
  storage:
    accessModes: [ReadWriteOnce]
    resources:
      requests:
        storage: 5Gi
    # storageClassName: ""

## Studio component configuration
##
studio:
  enable: true
  replicas: 1
  pod: {}
  service: {}
  config:
    - name: DEFAULT_ORGANIZATION_NAME
      value: "Default Organization"
    - name: DEFAULT_PROJECT_NAME
      value: "Default Project"
    # Create this Secret in the project namespace and uncomment to enable the AI Assistant.
    # - name: OPENAI_API_KEY
    #   valueFrom:
    #     secretKeyRef:
    #       name: openai-credentials
    #       key: api-key
  storage:
    accessModes: [ReadWriteOnce]
    resources:
      requests:
        storage: 1Gi
    # storageClassName: ""

## Supavisor component configuration
##
supavisor:
  enable: true
  pod: {}
  service: {}
  config:
    # The operator uses the project name as the tenant ID by default.
    # Uncomment to use a custom tenant ID.
    # - name: POOLER_TENANT_ID
    #   value: "my-tenant-id"
    - name: POOLER_DEFAULT_POOL_SIZE
      value: "20"
    - name: POOLER_MAX_CLIENT_CONN
      value: "100"
    - name: DB_POOL_SIZE
      value: "5"

## Analytics component configuration
##
analytics:
  enable: true
  replicas: 1
  pod: {}
  service: {}
  config: []

## Vector component configuration
##
vector:
  enable: true
  pod: {}
  config: []
