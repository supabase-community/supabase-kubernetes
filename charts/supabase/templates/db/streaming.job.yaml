{{- if and .Values.deployment.db.enabled .Values.deployment.db.streaming.enabled }}
{{- $streaming := .Values.deployment.db.streaming }}
{{- $config := include (print $.Template.BasePath "/db/streaming.config.yaml") . }}
apiVersion: batch/v1
kind: Job
metadata:
  # The name carries a digest of the SQL it runs. A Job's pod template is
  # immutable, so re-applying a changed one fails; deriving the name from the
  # content sidesteps that AND gives the right semantics -- a new Job appears
  # exactly when the SQL changes, and a configuration change becomes visible in
  # the Argo CD diff instead of hiding inside a resource that never varies.
  name: {{ include "supabase.db.streaming.fullname" . }}-{{ $config | sha256sum | trunc 8 }}
  labels:
    {{- include "supabase.labels" . | nindent 4 }}
  annotations:
    # A sync WAVE, not a hook.
    #
    # This used to be a `pre-upgrade` hook, which Argo CD runs as PreSync --
    # before the sync, and therefore before its own ConfigMap is applied. It
    # always executed the PREVIOUS SQL. Invisible while that SQL succeeded, and a
    # deadlock the moment it failed: the hook failed on the stale configuration,
    # and the sync that would have replaced that configuration was waiting for
    # the hook. Observed twice, unblocked by hand both times.
    #
    # Waves order resources INSIDE the sync, which is what was wanted all along:
    # wave 0 brings up the database and this Job's ConfigMap, wave 1 runs the SQL
    # against a database Argo CD has already found healthy, and the reader sits
    # in a later wave still. No phase is misused, and every resource is an
    # ordinary one that synchronises normally.
    argocd.argoproj.io/sync-wave: "1"
spec:
  backoffLimit: 6
  # Bounded on both sides: the wait below gives up, and the deadline covers the
  # pod never getting that far (image pull, scheduling).
  activeDeadlineSeconds: 900
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        {{- include "supabase.labels" . | nindent 8 }}
        app.kubernetes.io/component: db-streaming
    spec:
      restartPolicy: Never
      {{- with .Values.deployment.db.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.deployment.db.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: streaming
          image: "{{ .Values.image.db.repository }}:{{ .Values.image.db.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.db.pullPolicy }}
          env:
            {{- include "supabase.db.hostEnv" (dict "root" . "name" "PGHOST") | nindent 12 }}
            {{- include "supabase.db.portEnv" (dict "root" . "name" "PGPORT") | nindent 12 }}
            - name: PGUSER
              value: {{ $streaming.superuser | quote }}
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "supabase.secret.db.name" . }}
                  key: {{ include "supabase.secret.db.key.password" . }}
            - name: PGDATABASE
              valueFrom:
                secretKeyRef:
                  name: {{ include "supabase.secret.db.name" . }}
                  key: {{ include "supabase.secret.db.key.database" . }}
            - name: PGCONNECT_TIMEOUT
              value: "10"
            {{- with $streaming.reader.secretRef }}
            - name: STREAMING_READER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ . }}
                  key: {{ index (default (dict) $streaming.reader.secretRefKey) "password" | default "password" }}
            {{- end }}
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e

              # Wave 1 runs once Argo CD has found the database healthy, so an
              # absent one is a real fault rather than "not yet". This wait only
              # covers the gap between a pod being Ready and Postgres accepting
              # connections -- and giving up FAILS, because a reader started
              # against a database nobody prepared is worse than a red Job.
              attempts=0
              until pg_isready -q; do
                attempts=$((attempts + 1))
                if [ "$attempts" -ge 60 ]; then
                  echo "The database never accepted a connection." >&2
                  exit 1
                fi
                echo "Waiting for the database to accept connections..."
                sleep 5
              done

              psql -X -q -v ON_ERROR_STOP=1 -f /streaming/latent.sql
              echo "Latent streaming objects are in place."

              {{- if $streaming.reader.secretRef }}
              if [ -z "${STREAMING_READER_PASSWORD:-}" ]; then
                echo "reader.secretRef is set but the password it points at is empty." >&2
                exit 1
              fi
              psql -X -q -v ON_ERROR_STOP=1 -f /streaming/password.sql
              echo "Reader password set; the role can now connect."
              {{- else }}
              echo "No reader password configured; the role cannot connect."
              {{- end }}
          volumeMounts:
            - mountPath: /streaming
              name: streaming
          {{- with .Values.deployment.db.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        - name: streaming
          configMap:
            name: {{ include "supabase.db.streaming.fullname" . }}
{{- end }}
