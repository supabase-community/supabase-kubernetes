apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "supabase-operator.resourceName" (dict "suffix" "manager-role" "context" $) }}
rules:
- apiGroups:
  - ""
  resources:
  - configmaps
  - persistentvolumeclaims
  - secrets
  - serviceaccounts
  - services
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - ""
  resources:
  - events
  verbs:
  - create
  - patch
- apiGroups:
  - ""
  resources:
  - namespaces
  - nodes
  - pods
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - apps
  resources:
  - daemonsets
  - deployments
  - statefulsets
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - batch
  resources:
  - jobs
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - core.supabase.io
  resources:
  - analytics
  - auths
  - edgeruntimes
  - envoys
  - metas
  - migrations
  - projects
  - realtimes
  - rests
  - singledatabases
  - storages
  - studios
  - supavisors
  - vectors
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - core.supabase.io
  resources:
  - analytics/finalizers
  - auths/finalizers
  - edgeruntimes/finalizers
  - envoys/finalizers
  - metas/finalizers
  - migrations/finalizers
  - projects/finalizers
  - realtimes/finalizers
  - rests/finalizers
  - singledatabases/finalizers
  - storages/finalizers
  - studios/finalizers
  - supavisors/finalizers
  - vectors/finalizers
  verbs:
  - update
- apiGroups:
  - core.supabase.io
  resources:
  - analytics/status
  - auths/status
  - edgeruntimes/status
  - envoys/status
  - metas/status
  - migrations/status
  - projects/status
  - realtimes/status
  - rests/status
  - singledatabases/status
  - storages/status
  - studios/status
  - supavisors/status
  - vectors/status
  verbs:
  - get
  - patch
  - update
- apiGroups:
  - rbac.authorization.k8s.io
  resources:
  - clusterrolebindings
  - clusterroles
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
