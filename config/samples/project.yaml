apiVersion: core.supabase.io/v1alpha1
kind: Project
metadata:
  name: supabase
spec:
  # jwtExpSec: 1800

  http:
    protocol: "http"
    hostname: "api.supabase.local"

  databaseRef:
    kind: SingleDatabase
    name: supabase

  envoy:
    enable: true
    # replicas: 2
    # service:
    #   type: LoadBalancer

  meta:
    enable: true
    # replicas: 2

  rest:
    enable: true
    # replicas: 2

  storage:
    enable: true
    # replicas: 1
    storage:
      accessModes:
        - ReadWriteOnce
      size: 5Gi

  realtime:
    enable: true
    # replicas: 2

  functions:
    enable: true
    # replicas: 2

  studio:
    enable: true
    storage:
      accessModes:
        - ReadWriteOnce
      size: 1Gi

  auth:
    enable: true
    config:
      - name: "GOTRUE_SITE_URL"
        value: "https://myapp.supabase.com"
