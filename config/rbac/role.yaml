  - update
- apiGroups:
  - core.supabase.io
  resources:
  - auths/status
  - edgeruntimes/status
  - envoys/status
  - functions/status
  - meta/status
  - migrations/status
  - projects/status
  - realtimes/status
  - rests/status
  - singledatabases/status
  - storages/status
  - studios/status
  verbs:
  - get
  - patch
  - update
